<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Apply Mentor Notice</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #f5f5f5;
        font-family: HarmonyOS Sans SC, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;
        color: #333;
      }
      .wrap {
        max-width: 900px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 24px;
        overflow: hidden;
      }
      .header {
        background: #1c1917;
        color: #fff;
        padding: 28px 36px;
      }
      .header h1 {
        margin: 0;
        font-size: 30px;
      }
      .header p {
        margin: 8px 0 0;
        font-size: 20px;
      }
      .content {
        padding: 32px 36px;
        line-height: 1.65;
        font-size: 18px;
      }
      .title {
        color: #33c191;
        font-size: 28px;
        margin: 0 0 20px;
      }
      .highlight {
        color: #1b7dfd;
        font-weight: 600;
      }
      .btn {
        display: inline-block;
        margin-top: 16px;
        background: #1c1917;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
        padding: 10px 20px;
      }
      hr {
        border: none;
        border-top: 1px solid #e5e5e5;
        margin: 28px 0;
      }
      .footer {
        text-align: center;
        padding: 0 36px 28px;
      }
      .footer a {
        color: #549efe;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <h1>R2CN</h1>
        <p>学生申请提醒 · Student Application</p>
      </div>

      <div class="content">
        <h2 class="title">有学生申请任务</h2>
        <p>亲爱的 <span class="highlight">{{mentor_name}}</span></p>
        <p>学生 <span class="highlight">{{student_login}}</span> 已申请你的任务：<span class="highlight">{{task_title}}</span>。</p>
        <a class="btn" href="{{task_link}}">查看任务</a>

        <hr />

        <h2 class="title">A Student Applied for Your Task</h2>
        <p>Hi <span class="highlight">{{mentor_name}}</span></p>
        <p>Student <span class="highlight">{{student_login}}</span> has applied for your task: <span class="highlight">{{task_title}}</span>.</p>
        <a class="btn" href="{{task_link}}">View</a>
      </div>

      <div class="footer">
        <a href="{{project_link}}">{{project_link}}</a>
      </div>
    </div>
  </body>
</html>
